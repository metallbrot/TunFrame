zone "iodine-tunnel.com" IN {
    type forward;
    forwarders { 192.168.2.2; };
};

zone "dnscat2-tunnel.com" IN {
    type forward;
    forwarders { 192.168.3.3; };
};

options {
    listen-on { any; };
    allow-query { any; };
    directory "/var/cache/bind";
    dnssec-validation auto;
    validate-except { "dnscat2-tunnel.com"; };
};

server ::/0 { bogus yes; };