services:
  resolver:
    container_name: resolver
    image: ubuntu/bind9@sha256:45d541e9688f2c9010d22a78200117b66ed2df31b78f3464876f7e6e15cfaf77  # ubuntu/bind9:latest (Ubuntu 25.04 base) as built 2025-11-24
    environment:
      - BIND9_USER=root
      - TZ=Europe/Berlin
    ports:
      - 127.0.0.1:9999:53/tcp
      - 127.0.0.1:9999:53/udp
    volumes:
      - ./resolver/config:/etc/bind
      - ./resolver/cache:/var/cache/bind
      - ./resolver/records:/var/lib/bind
    networks:
      client-network:
        ipv4_address: 172.16.0.2
      internet:
        ipv4_address: 10.1.1.1
    restart: unless-stopped
    profiles:
      - essential

  tcpreplay:
    build: ./pcap-replayer
    container_name: pcap-replayer
    network_mode: service:resolver
    volumes:
      - ${PCAP_PATH}:/app
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: ["sh", "-c", "ip link add replay0 type dummy &&
      ip link set replay0 up &&
      echo '✓ replay0 created and ready' && tail -f /dev/null"
      ]
    depends_on:
      - resolver
    profiles:
      - essential

  dnscollector:
    container_name: dnscollector
    image: dmachard/dnscollector@sha256:f65dbd8d80dfe6a0d6825a76d8cdeeab589e07cf0af3c782e527bc2158413d01  # dmachard/dnscollector:latest as built 2026-11-19
    network_mode: service:resolver
    user: "0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./dns-collector/config/:/etc/dnscollector/
      - ./dns-collector/logs:/var/log/dnscollector
    restart: unless-stopped
    depends_on:
      - resolver
      - tcpreplay
    profiles:
      - essential

  root-simulator:
    container_name: root-simulator
    image: ubuntu/bind9@sha256:45d541e9688f2c9010d22a78200117b66ed2df31b78f3464876f7e6e15cfaf77  # ubuntu/bind9:latest (Ubuntu 25.04 base) as built 2025-11-24
    environment:
      - BIND9_USER=root
      - TZ=Europe/Berlin
    volumes:
      - ./root-simulator/config:/etc/bind
      - ./root-simulator/cache:/var/cache/bind
      - ./root-simulator/records:/var/lib/bind
    networks:
      internet:
        ipv4_address: 10.5.5.5
    restart: unless-stopped
    profiles:
      - essential

  tld-simulator:
    container_name: tld-simulator
    image: ubuntu/bind9@sha256:45d541e9688f2c9010d22a78200117b66ed2df31b78f3464876f7e6e15cfaf77  # ubuntu/bind9:latest (Ubuntu 25.04 base) as built 2025-11-24
    environment:
      - BIND9_USER=root
      - TZ=Europe/Berlin
    volumes:
      - ./tld-simulator/config:/etc/bind
      - ./tld-simulator/cache:/var/cache/bind
      - ./tld-simulator/records:/var/lib/bind
    networks:
      internet:
        ipv4_address: 10.10.10.10
      server-network:
        ipv4_address: 192.168.1.1
    restart: unless-stopped
    profiles:
      - essential
        
  dnsexfiltrator-client:
    container_name: dnsexfiltrator-client
    profiles: ["dnsexfiltrator"]
    volumes:
      - ./dnsexfiltrator-client/data:/data/
    build: ./dnsexfiltrator-client
    init: true
    entrypoint: ["sleep", "infinity"]
    networks:
      client-network:
        ipv4_address: 172.16.40.40
    depends_on:
      - dnsexfiltrator-server
      
  dnsexfiltrator-server:
    container_name: dnsexfiltrator-server
    profiles: ["dnsexfiltrator"]
    build: ./dnsexfiltrator-server
    volumes:
      - ./dnsexfiltrator-server/volume/:/app/
    init: true
    entrypoint: ["sleep", "infinity"]
    networks:
      server-network:
        ipv4_address: 192.168.4.4

networks:
  client-network:
    name: client-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/16
          gateway: 172.16.0.1
  server-network:
    name: server-network
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/16
          gateway: 192.168.0.1
  internet:
    name: internet
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.0.0/8
        gateway: 10.0.0.1

