# Template for config.yaml. Durations are in minutes. See README.md for every key.
global:
  name: "name"
  description: "description"
  public_resolver: "1.1.1.1"

detectors:
  active: ["MarkAll"]          # detector directory names; omit to load all

timing:
  wartime_duration: 60         # per configuration in DNSExfiltrator mode
  peacetime_duration: 20       # 0 disables peacetime
  benign_only_duration: 0      # benign-only window after peacetime (FPR without tunnel traffic); 0 disables it

allowlist:
  global_allowlist_path: ""    # e.g. "./allowlists/tranco.csv"

traffic:
  pcap_path: "./pcaps"
  benign:
    enabled: true
    pcap: "benign.pcap"
    pps: 20
  wildcard:
    enabled: false
    pcap: "wildcard.pcap"
    pps: 15
  tunnel:
    replay: false              # replay mode; ignored when dnsexfiltrator.enabled
    pcap: "tunneling.pcap"
    pps: 0
    tunneling_domains: ["tunnel.com", "exfil-sync.net", "cdn-telemetry.org", "update-check.info"]
    tunnel_server_ip: 192.168.4.4   # must be in 192.168.0.0/16
    expansion_factor: 1.6      # replay mode only

dnsexfiltrator:
  enabled: false
  stop_on_transfer_complete: true   # end a window once the server has saved the file
  baseline:
    file: "/data/synthetic_cc_data_100.csv"
    password: "tunframe"
    throttle: 0
    throttle_random: 0
    label_max_size: 63
    encoding: "base32"
    dilution: 0
    domains: ["tunnel.com"]    # must be listed in traffic.tunnel.tunneling_domains
  sweeps:
    - name: "throttle_sweep"
      parameter: "throttle"
      values: [5, 10, 20]
    - name: "domain_sweep"         # spread the transfer over more domains
      parameter: "domain_count"    # uses the first N domains of 'domains'
      values: [1, 2, 3, 4]
      domains: ["tunnel.com", "exfil-sync.net", "cdn-telemetry.org", "update-check.info"]
  profiles:
    - name: "stealth"
      throttle: 20
      throttle_random: 10
      label_max_size: 30

output:
  logdir: "./results/"
