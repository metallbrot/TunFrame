global:
  name: "Test"
  description: "Testing config"
  public_resolver: "1.1.1.1"

traffic:
  pcap_path: "./pcaps"
  benign:
    enabled: false
    pcap: "benign.pcap"
    pps: 10000

  wildcard:
    enabled: false
    pcap: "wildcard.pcap"
    pps: 1000

  tunnel:
    replay: false
    pcap: "tunnel.pcap"
    pps: 10
    toolname: "dnscat2"
    tunneling_domains: ["dnscat2-tunnel.com"]
    tunnel_server_ip: 192.168.3.3

timing:
  duration: 100

output:
  logdir: "./results/"